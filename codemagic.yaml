workflows:
  android-native-workflow:
    name: StudySync Android Native Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.studysync.app"
    scripts:
      - name: Set up JDK & Build Environment
        script: |
          java -version
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
      - name: Build Android Release App Bundle (AAB)
        script: |
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - roopakv2007@gmail.com
        notify:
          success: true
          failure: true
